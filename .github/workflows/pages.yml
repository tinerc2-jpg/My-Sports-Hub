name: GitHub Pages redirect (app moved to Vercel)

on:
  push:
    branches: [main]
    paths: [pages-redirect/**, index.html, sw.js, scripts/check-fixtures.mjs, manifest.webmanifest, "icon*", apple-touch-icon.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # never deploy an app with a JavaScript syntax error
      - run: node scripts/check-html.mjs
      # home/away must read right (home team first) – never deploy if not
      - run: node scripts/check-fixtures.mjs
      # The app lives on Vercel now (owner, 11 Nov 2026): Pages only forwards old links there
      - run: mkdir site && cp pages-redirect/index.html sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
