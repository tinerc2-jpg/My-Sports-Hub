name: Update live sports data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/update-live.mjs]

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-live.mjs
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      # Publish as a single commit on the live-data branch so main's history stays clean.
      - name: Publish to live-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
      # While a favourite is playing (or kicks off within 15 min) the script leaves out/live-needed:
      # re-run it every minute for as long as a game is on (up to 110 min per job; scheduled runs wait meanwhile).
      - name: Live updates every minute during games
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          end=$(( $(date +%s) + 110*60 ))
          while [ -f out/live-needed ] && [ "$(date +%s)" -lt "$end" ]; do
            sleep 15
            node scripts/update-live.mjs --live || break
            cd out
            git add live.json
            git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)" || true
            git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
            cd ..
          done
