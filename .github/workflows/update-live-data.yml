name: Update live sports data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/update-live.mjs]

permissions:
  contents: write
  actions: write   # the job starts its own successor (see the last step)

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Web Push sender (notifications straight from the app)
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/update-live.mjs
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      # Publish as a single commit on the live-data branch so main's history stays clean.
      - name: Publish to live-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data && break; echo "push failed ($i) – retrying"; sleep 10; done
      # The job keeps itself going instead of trusting GitHub's cron (26 Oct: no scheduled run for 2 h 10 min,
      # just before Rune's match). For up to 110 min: while a favourite is playing (or kicks off within 60 min,
      # out/live-needed) re-run --live every ~15 s; otherwise a full run every 15 min. Then it starts the next job.
      - name: Keep updating (live every ~15 s during games, full run every 15 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          # 110 min, but never hand over to the next job during a game: a new job can wait 10+ min for a runner
          # (31 Oct: 13 min without updates right at Barça's kick-off) – keep going while live, up to 5½ h in total
          start=$(date +%s); end=$(( start + 110*60 )); hard=$(( start + 330*60 )); last_full=$(date +%s)
          while [ "$(date +%s)" -lt "$end" ] || { [ -f out/live-needed ] && [ "$(date +%s)" -lt "$hard" ]; }; do
            sleep 15
            # every full run picks up the newest code from main, so a fix doesn't wait for the loop to end
            if [ $(( $(date +%s) - last_full )) -ge 900 ]; then last_full=$(date +%s); git fetch -q origin main && git checkout -q origin/main -- index.html scripts || true; node scripts/update-live.mjs || continue
            elif [ -f out/live-needed ]; then node scripts/update-live.mjs --live || continue
            else continue; fi
            cd out
            git add live.json
            git commit -qm "Live data $(date -u +%Y-%m-%dT%H:%MZ)" || true
            # a GitHub hiccup (500 on push, 23 Oct) must not end the loop: try again next round
            git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data || echo "push failed – retrying next round"
            cd ..
          done
      - name: Start the next job
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # after a failure wait 10 min first, so a bug can't start a job every minute (26 Oct: 3 failures in 4 min)
        run: |
          [ "${{ job.status }}" = "success" ] || sleep 600
          gh workflow run update-live-data.yml --ref main -R "$GITHUB_REPOSITORY" || echo "could not start the next job – cron takes over"
